apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    app: vote
    env: prod
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
        tier: frontend
    spec:
      containers:
      - name: vote
        image: dockersamples/examplevotingapp_vote
        ports:
        - containerPort: 80
        livenessProbe:
            httpGet:
                path: /
                port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
        readinessProbe:
            httpGet:
                path: /
                port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
        resources:
            requests:
                cpu: "100m"
                memory: "128Mi"
            limits:
                cpu: "250m"
                memory: "256Mi"